<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUL BLADE | MANGA SHOP 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. АРХІТЕКТУРА СТИЛІВ (CSS)
           ========================================= 
        */
        :root {
            --accent: #ff0044;
            --bg: #080808;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            overflow: hidden; /* Фіксуємо екран для 3D досвіду */
        }

        /* Фоновий канвас для глобальних ефектів */
        #global-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* =========================================
           2. ІНТЕРФЕЙС МАГАЗИНУ
           ========================================= 
        */
        .interface {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .header {
            position: absolute;
            top: 40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
        }

        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .logo span { color: var(--accent); }

        /* КАРТКА ТОВАРУ - ГОЛОВНА ІМБА */
        .product-card {
            width: 380px;
            height: 550px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .product-card:hover {
            border-color: var(--accent);
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(255, 0, 68, 0.2);
        }

        /* Контейнер для 3D моделі всередині картки */
        .model-viewer {
            width: 100%;
            height: 320px;
            margin-bottom: 20px;
            cursor: grab;
            position: relative;
        }

        .model-viewer:active { cursor: grabbing; }

        /* Текстова інформація */
        .badge {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 15px;
            font-weight: 900;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 15px;
            font-family: 'Oswald', sans-serif;
        }

        .description {
            font-size: 14px;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .footer-price {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .buy-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        /* Декоративні ієрогліфи */
        .kanji-decor {
            position: fixed;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            font-size: 150px;
            opacity: 0.03;
            writing-mode: vertical-rl;
            pointer-events: none;
        }

        /* =========================================
           3. UI ДОДАТКИ
           ========================================= 
        */
        .custom-cursor {
            width: 20px;
            height: 20px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s;
        }

    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor"></div>
    <div class="kanji-decor">魂の刃</div>
    <canvas id="global-canvas"></canvas>

    <div class="interface">
        <header class="header">
            <div class="logo">SOUL <span>BLADE</span></div>
            <div style="font-size: 12px; color: #555;">CHAPTER ONE: THE AWAKENING</div>
        </header>

        <div class="product-card">
            <div class="badge">LIMITED EDITION</div>
            
            <div id="book-container" class="model-viewer"></div>

            <h1 class="title">SOUL BLADE: <br>VOL. 01</h1>
            <p class="description">
                Перший том легендарної манги. Пориньте у світ, де кожне лезо має душу, а кожен воїн — свою таємницю. 200 сторінок чистого екшену.
            </p>

            <div class="footer-price">
                <div class="price">$10.00</div>
                <button class="buy-btn">Придбати</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           4. ЯДРО 3D РУШІЯ (Three.js)
           ========================================= 
        */

        // Глобальні змінні
        let scene, camera, renderer, book;
        let isHovering = false;

        function init() {
            // Створюємо сцену
            scene = new THREE.Scene();
            
            // Камера
            const container = document.getElementById('book-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.z = 5;

            // Рендерер з прозорим фоном
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Освітлення (як у професійній студії)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff0044, 2);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            const sideLight = new THREE.PointLight(0x00aaff, 1);
            sideLight.position.set(-5, 2, 2);
            scene.add(sideLight);

            // СТВОРЕННЯ 3D КНИГИ (МАНГИ)
            // Geometry: x=ширина, y=висота, z=товщина
            const geometry = new THREE.BoxGeometry(2.2, 3.2, 0.4);
            
            // Завантаження текстур (Використовуємо кольори, поки ти не вставиш свої лінки на обкладинки)
            const materials = [
                new THREE.MeshStandardMaterial({ color: 0x111111 }), // правий бік (сторінки)
                new THREE.MeshStandardMaterial({ color: 0x111111 }), // лівий бік
                new THREE.MeshStandardMaterial({ color: 0x111111 }), // верх
                new THREE.MeshStandardMaterial({ color: 0x111111 }), // низ
                new THREE.MeshStandardMaterial({ 
                    color: 0x222222,
                    roughness: 0.3,
                    metalness: 0.5
                    // Тут має бути твоя обкладинка: map: new THREE.TextureLoader().load('cover.jpg')
                }), // Передня частина
                new THREE.MeshStandardMaterial({ color: 0x050505 })  // Задня частина
            ];

            book = new THREE.Mesh(geometry, materials);
            scene.add(book);

            // Додаємо деталі "сторінок" (прорізи на зрізі)
            const lineMat = new THREE.LineBasicMaterial({ color: 0x333333 });
            const lineGeom = new THREE.EdgesGeometry(geometry);
            const wireframe = new THREE.LineSegments(lineGeom, lineMat);
            book.add(wireframe);

            // Початковий нахил
            book.rotation.y = -0.5;
            book.rotation.x = 0.2;

            animate();
        }

        // Анімаційний цикл
        function animate() {
            requestAnimationFrame(animate);

            if (!isHovering) {
                // Плавне обертання, коли мишка не на картці
                book.rotation.y += 0.01;
            }

            renderer.render(scene, camera);
        }

        // Взаємодія з мишею
        const card = document.querySelector('.product-card');
        
        card.addEventListener('mouseenter', () => {
            isHovering = true;
            gsap.to(book.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.5, ease: "power2.out" });
            gsap.to(book.rotation, { x: 0, y: Math.PI * 2, duration: 0.8 });
        });

        card.addEventListener('mouseleave', () => {
            isHovering = false;
            gsap.to(book.scale, { x: 1, y: 1, z: 1, duration: 0.5 });
        });

        // Трекінг миші для нахилу книги всередині контейнера
        document.addEventListener('mousemove', (e) => {
            if (isHovering) {
                const rect = document.getElementById('book-container').getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                
                gsap.to(book.rotation, {
                    x: -y * 0.5,
                    y: x * 0.8,
                    duration: 0.5
                });
            }

            // Кастомний курсор
            gsap.to("#cursor", {
                x: e.clientX - 10,
                y: e.clientY - 10,
                duration: 0
            });
        });

        // Ресайз
        window.addEventListener('resize', () => {
            const container = document.getElementById('book-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Запуск
        init();

        /* =========================================
           5. ГЛОБАЛЬНИЙ ФОН (Частинки/Ефекти)
           ========================================= 
        */
        const globalCanvas = document.getElementById('global-canvas');
        const gCtx = globalCanvas.getContext('2d');
        
        globalCanvas.width = window.innerWidth;
        globalCanvas.height = window.innerHeight;

        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * globalCanvas.width;
                this.y = Math.random() * globalCanvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = Math.random() > 0.5 ? '#ff0044' : '#333';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > globalCanvas.width) this.x = 0;
                if (this.y > globalCanvas.height) this.y = 0;
            }
            draw() {
                gCtx.fillStyle = this.color;
                gCtx.beginPath();
                gCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                gCtx.fill();
            }
        }

        for(let i=0; i<150; i++) particles.push(new Particle());

        function animateBg() {
            gCtx.clearRect(0,0, globalCanvas.width, globalCanvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        console.log("Soul Blade Manga Engine v1.0 - Active");
    </script>
</body>
</html>
