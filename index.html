<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKE ELITE | Professional E-commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <style>
        /* === CORE VARIABLES === */
        :root {
            --primary: #f66a05;
            --bg: #050505;
            --card: #111111;
            --text: #ffffff;
            --muted: #888888;
            --accent: #222222;
            --success: #00ff88;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; outline: none; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        /* === UI COMPONENTS === */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 5%; }
        .flex { display: flex; align-items: center; }
        .hidden { display: none !important; }
        .btn { padding: 12px 28px; border-radius: 4px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: var(--transition); border: none; font-size: 14px; }
        .btn-primary { background: var(--text); color: var(--bg); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255,255,255,0.1); }

        /* === NAVIGATION === */
        nav { position: fixed; top: 0; width: 100%; height: 80px; z-index: 2000; border-bottom: 1px solid var(--accent); background: rgba(5,5,5,0.8); backdrop-filter: blur(15px); }
        .nav-inner { height: 100%; justify-content: space-between; display: flex; align-items: center; }
        .logo { font-family: 'Anton'; font-size: 2rem; letter-spacing: 2px; }
        .nav-menu { display: flex; gap: 30px; }
        .nav-menu a { color: var(--text); text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .nav-actions { display: flex; gap: 20px; align-items: center; }
        .icon-btn { background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; position: relative; }
        #cartCount { position: absolute; top: -8px; right: -8px; background: var(--primary); font-size: 10px; padding: 2px 6px; border-radius: 50%; }

        /* === SEARCH SYSTEM === */
        #searchOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: flex; flex-direction: column; align-items: center; padding-top: 100px; transform: translateY(-100%); transition: var(--transition); }
        #searchOverlay.active { transform: translateY(0); }
        .search-box { width: 80%; max-width: 600px; position: relative; }
        .search-box input { width: 100%; background: none; border: none; border-bottom: 2px solid var(--text); padding: 15px; color: white; font-size: 2rem; font-family: 'Anton'; }

        /* === AUTH SYSTEM === */
        #authModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .auth-card { background: var(--card); padding: 40px; border-radius: 12px; width: 400px; border: 1px solid var(--accent); }
        .auth-card h2 { font-family: 'Anton'; margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #333; color: white; border-radius: 4px; }
        .auth-card .user-info { display: flex; flex-direction: column; align-items: center; }
        .avatar { width: 80px; height: 80px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 15px; }

        /* === CART SYSTEM === */
        #cartDrawer { position: fixed; right: 0; top: 0; height: 100vh; width: 400px; background: var(--card); z-index: 3500; transform: translateX(100%); transition: var(--transition); border-left: 1px solid var(--accent); padding: 30px; display: flex; flex-direction: column; }
        #cartDrawer.open { transform: translateX(0); }
        .cart-items { flex: 1; overflow-y: auto; margin-top: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
        .cart-total { margin-top: auto; padding-top: 20px; border-top: 2px solid var(--accent); }

        /* === PRODUCT GRID === */
        .hero { height: 90vh; display: flex; align-items: center; padding-top: 80px; }
        .hero-text { flex: 1; }
        .hero-3d { flex: 1; height: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 50px 0; }
        .p-card { background: var(--card); border-radius: 12px; padding: 20px; transition: var(--transition); position: relative; }
        .p-card:hover { transform: scale(1.02); background: #1a1a1a; }
        .p-img { width: 100%; height: 220px; object-fit: contain; margin-bottom: 15px; }
        .p-title { font-weight: 600; margin-bottom: 5px; }
        .p-price { color: var(--primary); font-weight: 800; font-size: 1.2rem; }

        /* === SUCCESS STATE === */
        #successScreen { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .checkmark { width: 100px; height: 100px; border-radius: 50%; border: 5px solid var(--success); color: var(--success); font-size: 4rem; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; animation: scaleUp 0.5s ease; }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }

        @media (max-width: 768px) {
            .nav-menu { display: none; }
            #cartDrawer { width: 100%; }
            .hero { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="searchOverlay">
        <button class="icon-btn" onclick="toggleSearch()" style="position:absolute; top:30px; right:30px; font-size:2rem;">&times;</button>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="SEARCH SNEAKERS..." onkeyup="handleSearch(event)">
            <p style="margin-top:20px; color:var(--muted)">Press Enter to find your style</p>
        </div>
    </div>

    <div id="authModal">
        <div class="auth-card" id="authContent">
            </div>
    </div>

    <div id="cartDrawer">
        <div class="flex" style="justify-content:space-between; margin-bottom:20px;">
            <h2 class="brand-font">YOUR CART</h2>
            <button class="icon-btn" onclick="toggleCart()" style="font-size:1.5rem;">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsList"></div>
        <div class="cart-total">
            <div class="flex" style="justify-content:space-between; margin-bottom:20px;">
                <span>Total:</span>
                <span id="cartTotalSum" style="font-size:1.5rem; font-weight:800;">$0</span>
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="checkout()">Checkout Now</button>
        </div>
    </div>

    <div id="successScreen">
        <div class="checkmark">✓</div>
        <h1 style="font-size:3rem; font-family:'Anton'">ORDER PLACED!</h1>
        <p style="margin:20px 0; color:var(--muted)">Your Nike Elite gear is on the way.</p>
        <button class="btn btn-primary" onclick="window.location.reload()">Return Home</button>
    </div>

    <nav>
        <div class="container nav-inner">
            <div class="logo">NIKE</div>
            <div class="nav-menu">
                <a href="#">New Releases</a>
                <a href="#">Men</a>
                <a href="#">Women</a>
                <a href="#">3D Design</a>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" onclick="toggleSearch()">🔍</button>
                <button class="icon-btn" id="authBtn" onclick="openAuth()">👤</button>
                <button class="icon-btn" onclick="toggleCart()">🛒 <span id="cartCount">0</span></button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <div class="hero-text">
                <h1 style="font-family:'Anton'; font-size: 5rem; line-height: 1;">ELITE<br><span style="color:var(--primary)">PERFORMANCE</span></h1>
                <p style="color:var(--muted); margin: 20px 0; max-width: 450px;">The next evolution of Nike Air technology. Explore, interact, and secure your pair today with our 3D configurator.</p>
                <button class="btn btn-primary" onclick="document.getElementById('shop').scrollIntoView()">Shop Collection</button>
            </div>
            <div class="hero-3d">
                <model-viewer src="https://modelviewer.dev/shared-assets/models/Shoe.gltf" auto-rotate camera-controls disable-zoom style="width:100%; height:100%;"></model-viewer>
            </div>
        </section>

        <section id="shop">
            <h2 style="font-family:'Anton'; font-size: 2.5rem; margin-top: 50px;">LATEST DROPS</h2>
            <div class="grid" id="productGrid">
                </div>
        </section>
    </main>

    <script>
        /* === DATABASE === */
        const products = [
            { id: 1, name: "Air Max 270", price: 160, img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400", cat: "Running" },
            { id: 2, name: "ZoomX Invincible", price: 180, img: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=400", cat: "Running" },
            { id: 3, name: "Jordan 1 Retro", price: 170, img: "https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2?w=400", cat: "Lifestyle" },
            { id: 4, name: "Air Force 1 '07", price: 110, img: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=400", cat: "Lifestyle" },
            { id: 5, name: "Nike Dunk Low", price: 115, img: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400", cat: "Skate" },
            { id: 6, name: "React Infinity", price: 160, img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400", cat: "Running" }
        ];

        let cart = [];
        let currentUser = JSON.parse(localStorage.getItem('nike_user')) || null;

        /* === INITIALIZATION === */
        function init() {
            renderProducts(products);
            updateCartUI();
            checkUserStatus();
        }

        /* === SEARCH LOGIC === */
        function toggleSearch() {
            document.getElementById('searchOverlay').classList.toggle('active');
            if(document.getElementById('searchOverlay').classList.contains('active')) {
                setTimeout(() => document.getElementById('searchInput').focus(), 500);
            }
        }

        function handleSearch(e) {
            const term = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term));
            renderProducts(filtered);
            if(e.key === "Enter") toggleSearch();
        }

        /* === PRODUCT RENDERING === */
        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = data.map(p => `
                <div class="p-card">
                    <img src="${p.img}" class="p-img">
                    <div class="p-title">${p.name}</div>
                    <div style="color:var(--muted); font-size:0.8rem; margin-bottom:10px;">${p.cat}</div>
                    <div class="flex" style="justify-content:space-between">
                        <span class="p-price">$${p.price}</span>
                        <button class="btn btn-primary" style="padding:8px 15px" onclick="addToCart(${p.id})">ADD +</button>
                    </div>
                </div>
            `).join('');
        }

        /* === CART LOGIC === */
        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
            if(!document.getElementById('cartDrawer').classList.contains('open')) toggleCart();
        }

        function updateCartUI() {
            const list = document.getElementById('cartItemsList');
            const count = document.getElementById('cartCount');
            const total = document.getElementById('cartTotalSum');
            
            count.innerText = cart.length;
            
            list.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <img src="${item.img}">
                    <div style="flex:1">
                        <div style="font-weight:600">${item.name}</div>
                        <div style="color:var(--primary)">$${item.price}</div>
                    </div>
                    <button class="icon-btn" onclick="removeFromCart(${index})">🗑️</button>
                </div>
            `).join('');

            const sum = cart.reduce((acc, curr) => acc + curr.price, 0);
            total.innerText = `$${sum}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkout() {
            if(!currentUser) {
                alert("Please login first to complete your purchase!");
                openAuth();
                return;
            }
            if(cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            document.getElementById('successScreen').style.display = 'flex';
        }

        /* === AUTH LOGIC === */
        function openAuth() {
            const modal = document.getElementById('authModal');
            const content = document.getElementById('authContent');
            modal.style.display = 'flex';

            if(currentUser) {
                content.innerHTML = `
                    <div class="user-info">
                        <div class="avatar">${currentUser.name[0]}</div>
                        <h3>Welcome back, ${currentUser.name}!</h3>
                        <p style="color:var(--muted); margin:10px 0;">${currentUser.email}</p>
                        <button class="btn btn-primary" style="width:100%; margin-top:20px;" onclick="logout()">Logout</button>
                        <button class="btn" style="color:white; margin-top:10px" onclick="closeAuth()">Close</button>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <h2>MEMBER LOGIN</h2>
                    <input type="text" id="authName" placeholder="Full Name">
                    <input type="email" id="authEmail" placeholder="Email Address">
                    <input type="password" placeholder="Password">
                    <button class="btn btn-primary" style="width:100%" onclick="login()">Sign In</button>
                    <p onclick="closeAuth()" style="text-align:center; margin-top:15px; cursor:pointer; color:var(--muted)">Cancel</p>
                `;
            }
        }

        function login() {
            const name = document.getElementById('authName').value;
            const email = document.getElementById('authEmail').value;
            if(!name || !email) return alert("Fill all fields");
            
            currentUser = { name, email };
            localStorage.setItem('nike_user', JSON.stringify(currentUser));
            closeAuth();
            checkUserStatus();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('nike_user');
            closeAuth();
            checkUserStatus();
        }

        function closeAuth() {
            document.getElementById('authModal').style.display = 'none';
        }

        function checkUserStatus() {
            const btn = document.getElementById('authBtn');
            btn.style.color = currentUser ? '#00ff88' : 'white';
        }

        window.onclick = (e) => {
            if(e.target == document.getElementById('authModal')) closeAuth();
        }

        // Run
        init();
    </script>
</body>
</html>
