<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTRO | Premium Tech Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
        /* ==========================================================================
           1. ЗМІННІ ТА ТЕМИ (Dark/Light)
           ========================================================================== */
        :root {
            --primary: #e63946;
            --primary-hover: #c1121f;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            
            /* Dark Theme (Default) */
            --bg-body: #0a0a0a;
            --bg-card: #151515;
            --bg-nav: rgba(10, 10, 10, 0.8);
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        [data-theme="light"] {
            --bg-body: #f5f5f7;
            --bg-card: #ffffff;
            --bg-nav: rgba(255, 255, 255, 0.8);
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* ==========================================================================
           2. БАЗОВІ СТИЛІ
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }

        button, a { cursor: pointer; text-decoration: none; color: inherit; transition: var(--transition); border: none; background: none; }

        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }

        /* ==========================================================================
           3. НАВІГАЦІЯ
           ========================================================================== */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: var(--bg-nav); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
        }

        nav { display: flex; justify-content: space-between; align-items: center; }

        .logo { font-family: 'Syncopate', sans-serif; font-size: 1.5rem; letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        .nav-tools { display: flex; align-items: center; gap: 20px; }

        /* Theme Toggle Button */
        .theme-toggle {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        .cart-btn { position: relative; font-size: 1.3rem; }
        .badge {
            position: absolute; -10px; right: -10px;
            background: var(--primary); color: white;
            font-size: 0.7rem; padding: 2px 6px; border-radius: 10px;
        }

        /* ==========================================================================
           4. ГЕРОЙ-СЕКЦІЯ (3D)
           ========================================================================== */
        .hero {
            height: 90vh; display: flex; align-items: center;
            padding-top: 80px; position: relative;
        }

        .hero-grid {
            display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 50px;
        }

        .hero-text h1 { font-size: clamp(3rem, 6vw, 5rem); font-weight: 800; line-height: 1; margin-bottom: 20px; }
        .hero-text p { color: var(--text-muted); font-size: 1.2rem; margin-bottom: 30px; }

        .hero-3d { width: 100%; height: 500px; position: relative; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }

        /* ==========================================================================
           5. СІТКА ТОВАРІВ (2 в ряд на мобільних)
           ========================================================================== */
        .section-title { font-size: 2rem; margin-bottom: 40px; text-align: center; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 колонки за замовчуванням */
            gap: 20px;
            margin-bottom: 80px;
        }

        @media (min-width: 900px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .product-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; padding: 15px; position: relative;
            transition: var(--transition);
        }

        .product-card:hover { transform: translateY(-10px); box-shadow: var(--shadow); border-color: var(--primary); }

        .product-img-box {
            width: 100%; height: 200px; display: flex; align-items: center; justify-content: center;
            background: rgba(128,128,128,0.05); border-radius: 15px; margin-bottom: 15px; overflow: hidden;
        }

        .product-img-box img { max-width: 80%; max-height: 80%; object-fit: contain; transition: 0.5s; }
        .product-card:hover .product-img-box img { transform: scale(1.1); }

        .product-info h3 { font-size: 1rem; margin-bottom: 8px; }
        .product-price { color: var(--primary); font-weight: 800; font-size: 1.2rem; }

        .view-btn {
            margin-top: 15px; width: 100%; padding: 10px;
            background: var(--text-main); color: var(--bg-body);
            border-radius: 10px; font-weight: 600; font-size: 0.9rem;
        }

        /* ==========================================================================
           6. МОДАЛЬНЕ ВІКНО ТОВАРУ (DETAILS)
           ========================================================================== */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;
        }

        .modal-content {
            background: var(--bg-card); width: 100%; max-width: 1000px;
            border-radius: 30px; display: grid; grid-template-columns: 1fr 1fr;
            overflow: hidden; position: relative; max-height: 90vh;
        }

        @media (max-width: 768px) {
            .modal-content { grid-template-columns: 1fr; overflow-y: auto; }
        }

        .modal-gallery { padding: 40px; background: #fff; display: flex; flex-direction: column; gap: 15px; }
        .main-img-wrap { height: 300px; display: flex; align-items: center; justify-content: center; }
        .main-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .thumb-grid { display: flex; gap: 10px; justify-content: center; }
        .thumb { width: 60px; height: 60px; border: 2px solid #eee; border-radius: 10px; cursor: pointer; padding: 5px; }
        .thumb.active { border-color: var(--primary); }

        .modal-details { padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .modal-details h2 { font-size: 2rem; margin-bottom: 10px; }
        .modal-details .desc { color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; }

        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; color: var(--text-muted); z-index: 10; }

        /* ==========================================================================
           7. ОФОРМЛЕННЯ ЗАМОВЛЕННЯ
           ========================================================================== */
        .checkout-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .input-group input {
            width: 100%; padding: 15px; background: var(--bg-body);
            border: 1px solid var(--border); border-radius: 12px; color: var(--text-main);
        }

        .order-btn {
            padding: 18px; background: var(--primary); color: white;
            border-radius: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
        }

        /* Плавна поява */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.6s ease forwards; }

    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo">ELECTRO<span>.</span></a>
                <div class="nav-tools">
                    <button class="theme-toggle" id="themeBtn">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="cart-btn">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="badge" id="cartCount">0</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <section class="hero container">
        <div class="hero-grid">
            <div class="hero-text fade-in">
                <h1>Next Gen Technology.</h1>
                <p>Відкрийте для себе майбутнє девайсів з повним зануренням у 3D та преміальним сервісом.</p>
                <button class="order-btn" style="padding: 15px 40px">До каталогу</button>
            </div>
            <div class="hero-3d fade-in">
                <model-viewer 
                    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
                    auto-rotate camera-controls shadow-intensity="1">
                </model-viewer>
            </div>
        </div>
    </section>

    <main class="container">
        <h2 class="section-title">Популярні товари</h2>
        <div class="product-grid" id="productGrid">
            </div>
    </main>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal"><i class="fas fa-times"></i></button>
            
            <div class="modal-gallery">
                <div class="main-img-wrap">
                    <img src="" id="mainModalImg" alt="">
                </div>
                <div class="thumb-grid" id="thumbGrid">
                    </div>
            </div>

            <div class="modal-details">
                <h2 id="modalTitle">Назва товару</h2>
                <p class="product-price" id="modalPrice">$0.00</p>
                <p class="desc">Це преміальний пристрій з найкращими характеристиками на ринку. Насолоджуйтесь якістю та швидкістю роботи.</p>
                
                <div class="checkout-form">
                    <div class="input-group">
                        <input type="text" id="userName" placeholder="Ваше ПІБ">
                    </div>
                    <div class="input-group">
                        <input type="tel" id="userPhone" placeholder="+380 (__) ___ __ __">
                    </div>
                    <div class="input-group">
                        <input type="text" id="userTg" placeholder="Ваш @Telegram">
                    </div>
                    <button class="order-btn" id="confirmOrder">Оформити замовлення</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Дані товарів
        const products = [
            {
                id: 1,
                name: "MacBook Pro M3",
                price: 1999,
                imgs: [
                    "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=500",
                    "https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=500",
                    "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500"
                ]
            },
            {
                id: 2,
                name: "iPhone 15 Pro Max",
                price: 1199,
                imgs: [
                    "https://images.unsplash.com/photo-1510557880182-3d4d3cba3f21?auto=format&fit=crop&w=500",
                    "https://images.unsplash.com/photo-1512054813130-f3830ecf5833?auto=format&fit=crop&w=500"
                ]
            },
            {
                id: 3,
                name: "Sony WH-1000XM5",
                price: 399,
                imgs: [
                    "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500",
                    "https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=500"
                ]
            },
            {
                id: 4,
                name: "Apple Watch Ultra",
                price: 799,
                imgs: [
                    "https://images.unsplash.com/photo-1544117518-30df57809b04?auto=format&fit=crop&w=500",
                    "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500"
                ]
            }
        ];

        const productGrid = document.getElementById('productGrid');
        const modal = document.getElementById('productModal');
        const themeBtn = document.getElementById('themeBtn');

        // 1. Рендер товарів (2 в ряд на мобайл, 4 на ПК)
        function initProducts() {
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card fade-in';
                card.innerHTML = `
                    <div class="product-img-box">
                        <img src="${p.imgs[0]}" alt="${p.name}">
                    </div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p class="product-price">$${p.price}</p>
                        <button class="view-btn" onclick="openProduct(${p.id})">Детальніше</button>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // 2. Відкриття товару
        window.openProduct = (id) => {
            const product = products.find(p => p.id === id);
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalPrice').innerText = `$${product.price}`;
            const mainImg = document.getElementById('mainModalImg');
            mainImg.src = product.imgs[0];

            // Галерея
            const thumbGrid = document.getElementById('thumbGrid');
            thumbGrid.innerHTML = '';
            product.imgs.forEach((src, idx) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = `thumb ${idx === 0 ? 'active' : ''}`;
                img.onclick = () => {
                    mainImg.src = src;
                    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
                    img.classList.add('active');
                };
                thumbGrid.appendChild(img);
            });

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };

        // 3. Закриття
        document.getElementById('closeModal').onclick = () => {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        // 4. Перемикач теми
        themeBtn.onclick = () => {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        };

        // 5. Оформлення замовлення
        document.getElementById('confirmOrder').onclick = () => {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            if(!name || !phone) return alert('Будь ласка, заповніть дані');

            document.querySelector('.modal-details').innerHTML = `
                <div style="text-align: center;" class="fade-in">
                    <i class="fas fa-check-circle" style="font-size: 4rem; color: #4CAF50; margin-bottom: 20px;"></i>
                    <h2>Дякуємо, ${name}!</h2>
                    <p style="color: var(--primary); font-weight: 700; margin-top: 10px;">
                        Ми звяжимося з вами за кілька хвилин
                    </p>
                    <p style="color: var(--text-muted); margin-top: 20px;">
                        Менеджер напише вам у Telegram або зателефонує.
                    </p>
                </div>
            `;
        };

        initProducts();
    </script>
</body>
</html>
